apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minimal reference overlay for vanilla Kubernetes. Copy this directory
# and adapt for your cluster.

namespace: multi-agent-commag

resources:
  - ../../base

patches:
  - path: configmap-patch.yaml
  - path: secret-patch.yaml

images:
  - name: multi-agent-commag
    newName: ghcr.io/YOUR_ORG/multi-agent-commag
    newTag: latest
