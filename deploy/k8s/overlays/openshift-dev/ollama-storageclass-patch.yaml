# Pin the Ollama model cache PVC to nfs-client (same reason as InfluxDB).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
spec:
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 50Gi
