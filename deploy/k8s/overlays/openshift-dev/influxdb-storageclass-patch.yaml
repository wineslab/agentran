# Pin InfluxDB PVCs to nfs-client. The cluster-default `nfs` class has
# an unresponsive provisioner in this namespace.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 1Gi
