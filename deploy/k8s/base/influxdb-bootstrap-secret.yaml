# Bootstrap admin/password for the bundled InfluxDB.
# The admin TOKEN is sourced from agents-secrets.INFLUXDB_TOKEN so it
# stays in sync with what the agents use to read/write InfluxDB.
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-bootstrap
type: Opaque
stringData:
  INFLUXDB_USERNAME: "admin"
  INFLUXDB_PASSWORD: "changeme-please"
