apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OAI RAN: gNB and nrUE (+ dl-traffic sidecar) in RFsim mode.
# Built from the agentRAN OAI fork in this repo's oai/ submodule.
#
# Image builds are out-of-band — see ../ran/README.md.

resources:
  - gnb-deployment.yaml
  - gnb-service.yaml
  - nrue-deployment.yaml

configMapGenerator:
  - name: oai-gnb-config
    files:
      - gnb.yaml=../../../oai-ran/gnb.yaml
  - name: oai-nrue-config
    files:
      - nrue.yaml=../../../oai-ran/nrue.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: multi-agent-commag-oai
    includeSelectors: false
